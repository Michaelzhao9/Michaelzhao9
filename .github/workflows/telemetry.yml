name: telemetry

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stats.py --selftest
      - name: Render dashboard.svg
        env:
          PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
        run: python3 scripts/stats.py out/dashboard.svg
      - name: Publish to output branch
        if: hashFiles('out/dashboard.svg') != ''
        run: |
          cd out
          git init -q -b output
          git add dashboard.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "telemetry $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" output
